  <body>
    <div id="ruffle" width="100%" height="100%"></div>
    <script>
      // Point Ruffle at its official self-hosted package so the WASM runtime
      // and lazy-loaded core chunks resolve correctly on Vercel.
      window.RufflePlayer = {config: {publicPath: "https://unpkg.com/@ruffle-rs/ruffle/"}};
    </script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle/ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("achievementunlocked.swf");
      });
    </script>
